<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baek Jongeun — Paintings</title>
<meta name="description" content="Baek Jongeun (백종은) — oil paintings">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#141414; --muted:#8a8a8a; --line:#e6e6e6;
    --pad:clamp(14px,2vw,24px);
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --kr:"Noto Sans KR",system-ui,sans-serif;
  }
  html.dark{ --bg:#111111; --fg:#ececec; --muted:#7a7a7a; --line:#2a2a2a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);transition:background .35s,color .35s}
  body{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1.5;-webkit-font-smoothing:antialiased}
  a,button{color:inherit;text-decoration:none;font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;cursor:pointer}
  a:hover,button:hover{color:var(--muted)}
  .kr{font-family:var(--kr);letter-spacing:.02em;text-transform:none}

  /* corner labels */
  .corner{position:fixed;z-index:10;padding:var(--pad);display:flex;gap:18px;white-space:nowrap}
  .tl{top:0;left:0}.tr{top:0;right:0}.bl{bottom:0;left:0}.br{bottom:0;right:0}
  .ml{top:50%;left:0;transform:translateY(-50%)}.mr{top:50%;right:0;transform:translateY(-50%);text-align:right}
  .nav-current{color:var(--muted)}

  /* views */
  .view{display:none}
  .view.on{display:block}

  /* single work */
  #work{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
  #work.on{display:flex}
  .stage{position:relative;display:flex;align-items:center;justify-content:center;
         height:calc(100vh - 180px);width:min(72vw,1100px)}
  .stage img{max-height:100%;max-width:100%;object-fit:contain;display:block;
             opacity:0;transition:opacity .45s ease;user-select:none;-webkit-user-drag:none}
  .stage img.ready{opacity:1}
  .hit{position:absolute;top:0;bottom:0;width:50%;z-index:2}
  .hit.prev{left:0;cursor:w-resize}.hit.next{right:0;cursor:e-resize}
  .caption{margin-top:16px;text-align:center;color:var(--fg);min-height:3em}
  .caption .sub{color:var(--muted)}

  /* index grid */
  #index{padding:90px var(--pad) 90px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:48px 28px;max-width:1200px;margin:0 auto}
  .grid a{display:flex;flex-direction:column;gap:10px}
  .grid .thumb{aspect-ratio:3/4;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .grid img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .25s}
  .grid a:hover img{opacity:.75}
  .grid .t{text-align:center}

  /* about */
  #about{padding:110px var(--pad) 110px;display:none}
  #about.on{display:block}
  .about{max-width:560px;margin:0 auto;display:grid;gap:36px}
  .about h2{font-weight:400;color:var(--muted);margin-bottom:10px;font-size:11px}
  .about p,.about li{font-size:12px;line-height:1.75}
  .about p.kr{font-size:13.5px;line-height:1.9}
  .about ul{list-style:none}
  .about .row{display:grid;grid-template-columns:70px 1fr;gap:12px}

  @media (max-width:720px){
    .ml,.mr{display:none}
    .stage{width:calc(100vw - 32px);height:auto}
    .stage img{max-height:calc(100vh - 230px)}
    .tr{gap:12px}
  }
</style>
</head>
<body>

<!-- 고정 모서리 메뉴 -->
<a class="corner tl" href="#work-01" aria-label="Home">Baek Jongeun <span class="kr" style="margin-left:6px">백종은</span></a>
<nav class="corner tr">
  <a href="#work-01" data-nav="work">Works</a>
  <a href="#index" data-nav="index">Index</a>
  <a href="#about" data-nav="about">About</a>
  <button id="themeBtn" type="button" aria-label="Toggle dark mode">Dark</button>
</nav>

<!-- 작품 한 점 보기 -->
<main id="work" aria-live="polite">
  <a class="corner ml" id="prevLabel" href="#"></a>
  <a class="corner mr" id="nextLabel" href="#"></a>
  <div class="stage">
    <img id="workImg" alt="">
    <a class="hit prev" id="hitPrev" href="#" aria-label="Previous work"></a>
    <a class="hit next" id="hitNext" href="#" aria-label="Next work"></a>
  </div>
  <div class="caption" id="caption"></div>
  <div class="corner bl" id="counter"></div>
  <a class="corner br" href="#index">Index</a>
</main>

<!-- 전체 작품 목록 -->
<section id="index" class="view"><div class="grid" id="grid"></div></section>

<!-- 작가 소개 -->
<section id="about">
  <div class="about">
    <div>
      <h2>About</h2>
      <p class="kr">백종은은 산과 바다가 하나의 흐름으로 이어지는 풍경을 그린다. 설산의 능선은 파도가 되고, 파도의 포말은 다시 구름과 눈으로 번진다. <span style="color:var(--muted)">(작가 노트로 바꿔 주세요)</span></p>
    </div>
    <div>
      <h2>Education</h2>
      <ul>
        <li class="row"><span>20—</span><span class="kr">학력을 적어 주세요</span></li>
      </ul>
    </div>
    <div>
      <h2>Exhibitions</h2>
      <ul>
        <li class="row"><span>2026</span><span class="kr">전시 이력을 적어 주세요</span></li>
      </ul>
    </div>
    <div>
      <h2>Contact</h2>
      <ul>
        <li>Email — your@email.com</li>
        <li><a href="https://instagram.com/" target="_blank" rel="noopener">Instagram ↗</a></li>
      </ul>
    </div>
  </div>
</section>

<script>
/* ===== 작품 정보: 여기만 고치면 됩니다 ===== */
const WORKS = [
  { file:"img/work-01.jpg", thumb:"img/work-01-t.jpg", title:"Untitled 01", medium:"Oil on canvas", size:"— × — cm", year:"2026" },
  { file:"img/work-02.jpg", thumb:"img/work-02-t.jpg", title:"Untitled 02", medium:"Oil on canvas", size:"— × — cm", year:"2026" },
  { file:"img/work-03.jpg", thumb:"img/work-03-t.jpg", title:"Untitled 03", medium:"Oil on canvas", size:"— × — cm", year:"2026" },
  { file:"img/work-04.jpg", thumb:"img/work-04-t.jpg", title:"Untitled 04", medium:"Oil on canvas", size:"— × — cm", year:"2026" },
  { file:"img/work-05.jpg", thumb:"img/work-05-t.jpg", title:"Untitled 05", medium:"Oil on canvas", size:"— × — cm", year:"2026" },
];
/* ========================================== */

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const id = i => "work-" + pad(i+1);
const wrap = i => (i + WORKS.length) % WORKS.length;

// 목록(Index) 그리드
$("#grid").innerHTML = WORKS.map((w,i)=>`
  <a href="#${id(i)}">
    <div class="thumb"><img src="${w.thumb}" alt="${w.title}" loading="lazy"></div>
    <div class="t">${pad(i+1)} — ${w.title}</div>
  </a>`).join("");

let current = -1;
function showWork(i){
  const w = WORKS[i], img = $("#workImg");
  if (i !== current){
    img.classList.remove("ready");
    const pre = new Image();
    pre.onload = () => { img.src = w.file; img.alt = `${w.title}, ${w.medium}, ${w.year}`; requestAnimationFrame(()=>img.classList.add("ready")); };
    pre.src = w.file;
    current = i;
  }
  $("#caption").innerHTML = `${w.title}<br><span class="sub">${w.medium}, ${w.size}, ${w.year}</span>`;
  $("#counter").textContent = `${pad(i+1)} / ${pad(WORKS.length)}`;
  const p = wrap(i-1), n = wrap(i+1);
  $("#prevLabel").textContent = "← " + WORKS[p].title; $("#prevLabel").href = "#"+id(p); $("#hitPrev").href = "#"+id(p);
  $("#nextLabel").textContent = WORKS[n].title + " →"; $("#nextLabel").href = "#"+id(n); $("#hitNext").href = "#"+id(n);
  [p,n].forEach(k => { const im = new Image(); im.src = WORKS[k].file; }); // 앞뒤 작품 미리 불러오기
}

function route(){
  const h = location.hash.slice(1) || "work-01";
  const m = h.match(/^work-(\d+)$/);
  const view = m ? "work" : (h === "index" || h === "about") ? h : "work";
  $("#work").classList.toggle("on", view==="work");
  $("#index").classList.toggle("on", view==="index");
  $("#about").classList.toggle("on", view==="about");
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("nav-current", a.dataset.nav===view));
  if (view === "work"){
    const i = m ? Math.min(Math.max(parseInt(m[1],10)-1,0), WORKS.length-1) : 0;
    showWork(i);
    document.title = `${WORKS[i].title} — Baek Jongeun`;
  } else {
    document.title = (view==="index" ? "Index" : "About") + " — Baek Jongeun";
    window.scrollTo(0,0);
  }
}
window.addEventListener("hashchange", route);
route();

// 키보드 ← →
document.addEventListener("keydown", e => {
  if (!$("#work").classList.contains("on")) return;
  if (e.key === "ArrowLeft")  location.hash = id(wrap(current-1));
  if (e.key === "ArrowRight") location.hash = id(wrap(current+1));
});

// 모바일 스와이프
let x0 = null;
$("#work").addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
$("#work").addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) location.hash = id(wrap(current + (dx < 0 ? 1 : -1)));
});

// 라이트/다크 전환
const root = document.documentElement;
function setTheme(d){ root.classList.toggle("dark", d); $("#themeBtn").textContent = d ? "Light" : "Dark"; }
let saved = null; try { saved = localStorage.getItem("theme"); } catch(e){}
setTheme(saved === "dark");
$("#themeBtn").addEventListener("click", () => {
  const d = !root.classList.contains("dark"); setTheme(d);
  try { localStorage.setItem("theme", d ? "dark" : "light"); } catch(e){}
});
</script>
</body>
</html>
